<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RenSpectrum · 页面已迁移</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#050816;--fg:#edf4ff;--muted:#a8b6d0;--line:rgba(135,166,230,.22);--cyan:#22d3ee;--blue:#60a5fa}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
     color:var(--fg);padding:32px;
     background:radial-gradient(circle at 18% 12%,#16285c 0,transparent 28%),
                radial-gradient(circle at 84% 18%,#3b1d64 0,transparent 26%),
                linear-gradient(155deg,#030611 0,#071124 52%,#050713 100%);
     font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.card{max-width:540px;width:100%;background:rgba(13,21,43,.68);border:1px solid var(--line);
      border-radius:16px;padding:42px 38px;text-align:center;backdrop-filter:blur(14px);
      box-shadow:0 24px 64px rgba(0,0,0,.45)}
.kicker{font-size:11px;letter-spacing:.24em;color:var(--cyan);margin:0 0 20px;font-weight:700}
h1{font-size:21px;margin:0 0 12px;font-weight:650;line-height:1.45}
.sub{font-size:13.5px;color:var(--muted);margin:0 0 26px;line-height:1.8}
code{font-size:12px;color:#8bdcf2;word-break:break-all;background:rgba(34,211,238,.07);
     padding:2px 6px;border-radius:4px;display:inline-block;margin-top:6px}
a.btn{display:inline-block;background:linear-gradient(135deg,#d9fbff,#a9d4ff);color:#06111f;
      text-decoration:none;padding:12px 28px;border-radius:999px;font-size:14px;font-weight:700}
a.btn:hover{filter:brightness(1.05)}
.hint{margin:22px 0 0;font-size:11.5px;color:#6d7c96;line-height:1.7}
</style>
</head>
<body>
<main class="card">
  <p class="kicker">RENSPECTRUM</p>
  <h1>该页面已迁移至新地址</h1>
  <p class="sub">This page has moved. 正在跳转到新站点对应位置…<br>若未自动跳转，请点击下方按钮。</p>
  <a class="btn" id="go" href="https://ghtmath.pages.dev/">ghtmath.pages.dev →</a>
  <p class="hint" id="path"></p>
</main>
<script>
(function () {
  var base = 'https://ghtmath.pages.dev';
  var path = location.pathname.replace(/^\/ghtmath/, '') || '/';
  var url = base + path + location.search + location.hash;
  document.getElementById('go').href = url;
  document.getElementById('path').innerHTML = '目标地址 · Target: <code>' + url.replace(/^https:\/\//, '') + '</code>';
  setTimeout(function () { location.replace(url); }, 1500);
})();
</script>
</body>
</html>
